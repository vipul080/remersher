name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libboost-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen boost

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Smoke test
        run: |
          for m in cube torus plane_hole gear; do
            ./build/remersher -i meshes/$m.obj -o $m.out.obj -t 1000 --timeout 60
            test "$(grep -c '^f ' $m.out.obj)" -gt 100
          done

      - name: Blender add-on tests
        run: python3 tests/test_blender_core.py

      - name: Package Blender add-on
        run: ./scripts/package_addon.sh

      - uses: actions/upload-artifact@v4
        with:
          name: remersher-blender-${{ matrix.os }}
          path: dist/*.zip

  arch:
    # Rolling-release toolchain (newest GCC, CMake, Boost) to catch breakage early.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake boost eigen git

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Smoke test
        run: |
          for m in cube torus plane_hole gear; do
            ./build/remersher -i meshes/$m.obj -o $m.out.obj -t 1000 --timeout 60
            test "$(grep -c '^f ' $m.out.obj)" -gt 100
          done

  blender:
    # Installs the packaged add-on in a real Blender and remeshes a mesh through it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libboost-dev libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6
      - name: Build and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ./scripts/package_addon.sh
      - name: Download Blender
        run: |
          curl -sSL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender.tar.xz
      - name: Add-on smoke test
        run: ./blender-4.2.3-linux-x64/blender -b --factory-startup --python tests/blender_smoke.py -- dist/remersher_blender-linux-x86_64.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: vcpkg install eigen3 boost-graph --triplet x64-windows

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release -j 4

      - name: Smoke test
        shell: bash
        run: |
          for m in cube torus plane_hole gear; do
            ./build/Release/remersher.exe -i meshes/$m.obj -o $m.out.obj -t 1000 --timeout 60
            test "$(grep -c '^f ' $m.out.obj)" -gt 100
          done

      - name: Package Blender add-on
        run: python scripts/package_addon.py build/Release/remersher.exe

      - name: Add-on smoke test in Blender
        shell: bash
        run: |
          curl -sSL -o blender.zip https://download.blender.org/release/Blender4.2/blender-4.2.3-windows-x64.zip
          unzip -q blender.zip
          ./blender-4.2.3-windows-x64/blender.exe -b --factory-startup --python tests/blender_smoke.py -- dist/remersher_blender-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: remersher-blender-windows
          path: dist/*.zip
